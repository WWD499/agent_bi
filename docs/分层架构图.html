<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>系统分层架构图</title>
<style>body{margin:0;padding:20px;display:flex;justify-content:center;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
svg{max-width:100%;height:auto}</style>
</head><body>
<svg viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <text x="340" y="28" text-anchor="middle" font-size="15px" font-weight="500" fill="#2C2C2A">系统分层架构</text>

  <g>
    <rect x="120" y="48" width="440" height="52" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="340" y="70" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">前端交互层</text>
    <text x="340" y="88" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">界面工程 · 令牌认证 · 流式事件读取（SSE）</text>
  </g>

  <line x1="340" y1="100" x2="340" y2="126" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="140" y="130" width="400" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="340" y="152" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">接入网关层</text>
    <text x="340" y="170" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">登录控制器 · 对话控制器 · 令牌配置</text>
  </g>

  <line x1="340" y1="182" x2="340" y2="208" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="100" y="212" width="480" height="52" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="234" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">智能体编排层（核心）</text>
    <text x="340" y="252" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">推理主服务 · 会话管理 · 记忆管理 · 工具接口注册</text>
  </g>

  <line x1="340" y1="264" x2="340" y2="290" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="90" y="294" width="500" height="52" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
    <text x="340" y="316" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">业务服务层</text>
    <text x="340" y="334" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">查询服务 · 知识服务 · 预警服务 · 数据源服务 · 图表选型器</text>
  </g>

  <line x1="340" y1="346" x2="340" y2="372" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="130" y="376" width="420" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
    <text x="340" y="398" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">基础设施层</text>
    <text x="340" y="416" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">大模型调用服务 · 安全校验器 · 向量检索引擎</text>
  </g>

  <line x1="340" y1="428" x2="340" y2="454" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#b)"/>

  <g>
    <rect x="100" y="458" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="220" y="480" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">PostgreSQL</text>
    <text x="220" y="498" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">系统库 + 业务配置表 + pgvector向量</text>
  </g>
  <g>
    <rect x="360" y="458" width="220" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="470" y="480" text-anchor="middle" font-size="14px" font-weight="500" fill="#2C2C2A" dominant-baseline="central">MySQL</text>
    <text x="470" y="498" text-anchor="middle" font-size="12px" fill="#444441" dominant-baseline="central">动态业务数据源（按需接入）</text>
  </g>

  <text x="110" y="76" font-size="12px" font-weight="500" fill="#888780" dominant-baseline="central">L1</text>
  <text x="122" y="158" font-size="12px" font-weight="500" fill="#888780" dominant-baseline="central">L2</text>
  <text x="82" y="240" font-size="12px" font-weight="500" fill="#888780" dominant-baseline="central">L3</text>
  <text x="72" y="322" font-size="12px" font-weight="500" fill="#888780" dominant-baseline="central">L4</text>
  <text x="112" y="404" font-size="12px" font-weight="500" fill="#888780" dominant-baseline="central">L5</text>

  <rect x="40" y="528" width="600" height="24" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.3"/>
  <text x="55" y="544" font-size="12px" dominant-baseline="central" fill="#444441">自上而下：用户交互 → 请求接入 → 推理编排 → 业务能力 → 底层支撑 → 数据持久化</text>
</svg>
</body></html>
